[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ca-radar"
version = "0.1.1"
description = "Conditional Access Gap Analyser & Visualiser for Microsoft 365 / Entra ID"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anjula Weeranayake", email = "investwithdon7@gmail.com" }]
keywords = ["security", "microsoft365", "entra", "conditional-access", "msp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "msal>=1.28",
    "msgraph-sdk>=1.3",
    "networkx>=3.3",
    "jinja2>=3.1",
    "httpx>=0.27",
    "anyio>=4.4",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "types-python-dateutil",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs>=1.6",
]

[project.scripts]
ca-radar = "ca_radar.cli:app"

[project.urls]
Homepage = "https://github.com/investwithdon7-rgb/ca-radar"
Repository = "https://github.com/investwithdon7-rgb/ca-radar"
Issues = "https://github.com/investwithdon7-rgb/ca-radar/issues"

[tool.hatch.build.targets.wheel]
packages = ["ca_radar"]
include = ["ca_radar/**"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=ca_radar --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
